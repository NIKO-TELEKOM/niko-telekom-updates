
name: NIKO TELEKOM Update Server

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install pyinstaller

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --onefile --windowed --name NIKO_TELEKOM NIKO_TELEKOM_POS_V30.py

      - name: Calculate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/NIKO_TELEKOM.exe -Algorithm SHA256).Hash.ToLower()
          $version = "${{ github.ref_name }}".TrimStart("v")
          $manifest = @{
            version = $version
            download_url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NIKO_TELEKOM.exe"
            sha256 = $hash
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force public | Out-Null
          Set-Content -Path public/latest.json -Value $manifest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NIKO_TELEKOM.exe

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy update manifest
        uses: actions/deploy-pages@v4
